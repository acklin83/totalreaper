name: Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: reaper_totalreaper-arm64.dylib
            artifact_path: build/reaper_totalreaper-arm64.dylib
            configure_extra: ""
          - os: macos-latest
            artifact: reaper_totalreaper-x86_64.dylib
            artifact_path: build/reaper_totalreaper-x86_64.dylib
            configure_extra: "-DCMAKE_OSX_ARCHITECTURES=x86_64"
          - os: windows-latest
            artifact: reaper_totalreaper.dll
            artifact_path: build/Release/reaper_totalreaper.dll
            configure_extra: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.configure_extra }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
