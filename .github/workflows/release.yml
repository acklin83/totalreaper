name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: reaper_totalreaper-arm64.dylib
            artifact_path: build/reaper_totalreaper-arm64.dylib
          - os: windows-latest
            artifact: reaper_totalreaper.dll
            artifact_path: build/Release/reaper_totalreaper.dll

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/reaper_totalreaper-arm64.dylib/reaper_totalreaper-arm64.dylib
            artifacts/reaper_totalreaper.dll/reaper_totalreaper.dll
          generate_release_notes: true
          fail_on_unmatched_files: true
